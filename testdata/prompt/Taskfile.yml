version: 3

tasks:
  foo:
    prompt: Do you want to continue?
    cmds:
      - echo 'foo'

  bar:
    cmds:
      - task: show-prompt

  show-prompt:
    prompt: Do you want to continue?
    cmds:
      - echo 'show-prompt'

  multi-prompt:
    prompt:
      - Do you want to continue?
      - Are you sure?
    cmds:
      - echo 'multi-prompt'

  prompt-in-cmds:
    cmds:
      - echo 'foo'
      - prompt: Do you want to continue?
      - echo 'bar'

  prompt-in-cmd:
    cmds:
      - echo 'foo'
      - prompt: Do you want to continue?
        cmd: echo 'dangerous'
      - echo 'bar'
